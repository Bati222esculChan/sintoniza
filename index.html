<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sintoniza</title>
<meta name="description" content="Descubre tus géneros musicales, comparte playlists y recomienda canciones a tus amigos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior con dial FM y pestañas; una columna de tarjetas debajo */
:root{
  --bg:#F2F1F6; --surface:#FFFFFF; --fg:#17151F; --muted:#625E70; --line:#DCD9E6;
  --accent:#3047E0; --accent-soft:#E4E7FC; --amber:#E58A00; --on-accent:#FFFFFF;
  --ok:#1E8E4E; --bad:#C8352B; --spotify:#1A9E48;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121019; --surface:#1C1926; --fg:#EEEAF6; --muted:#A29DB2; --line:#332F40;
  --accent:#8592FF; --accent-soft:#272A4D; --amber:#FFB547; --on-accent:#121019;
  --ok:#4CD486; --bad:#FF7A6E; --spotify:#3DDC74; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}

/* barra */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 11px var(--mono);color:var(--amber);letter-spacing:.06em}
.who{font:500 13px var(--mono);color:var(--muted)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;border:1.5px solid transparent;position:relative}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a.on{color:var(--fg);border-color:var(--line);background:var(--surface)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--amber);color:#17151F;font:600 11px/18px var(--mono);text-align:center}

/* dial */
.dial{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px 8px;position:relative;overflow:hidden}
.ticks{position:relative;height:30px}
.ticks i{position:absolute;bottom:13px;width:1px;background:var(--line);height:7px}
.ticks i.big{height:12px;background:var(--muted)}
.ticks b{position:absolute;bottom:0;transform:translateX(-50%);font:500 10px var(--mono);color:var(--muted)}
.needle{position:absolute;top:6px;bottom:6px;width:2px;background:var(--amber);border-radius:2px;box-shadow:0 0 10px var(--amber);transition:left .5s cubic-bezier(.3,1.4,.5,1)}
.freq{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.freq strong{color:var(--fg)}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow,.q-num{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5.5vw,38px);line-height:1.1}
h1 span{color:var(--accent)}
h2{font-family:var(--display);font-weight:500;font-size:clamp(19px,4vw,24px);line-height:1.2}
h3{font-family:var(--display);font-weight:500;font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sep{border-top:1px solid var(--line);padding-top:16px}

/* formularios */
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label span.hint{font-weight:400;color:var(--muted);font-size:12px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
form{display:flex;flex-direction:column;gap:14px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.err{color:var(--bad);font-size:14px;min-height:1em}
.okmsg{color:var(--ok);font-size:14px}

/* botones */
.btn{font:600 14px var(--body);border-radius:999px;padding:10px 18px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--fg);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sp{border-color:var(--spotify);color:var(--spotify)}
.btn.sp.fill{background:var(--spotify);color:#0B1A10}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* encuesta */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{appearance:none;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font:500 11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex:none}

/* géneros y canciones */
.genre{display:flex;flex-direction:column;gap:10px}
.g-pct{font:500 13px var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:6px;transition:width .8s ease}
.songs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.songs li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);min-width:0;flex-wrap:wrap}
.songs li:last-child{border-bottom:0}
.songs .n{font:500 12px var(--mono);color:var(--muted);width:20px;flex:none;font-variant-numeric:tabular-nums}
.songs .t{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.songs .t strong{font-weight:600}
.songs .t span{color:var(--muted)}
.acts{display:flex;gap:5px;flex:none;flex-wrap:wrap}
.acts a,.acts button{font:500 11px var(--mono);color:var(--accent);background:transparent;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
.acts a:hover,.acts button:hover{border-color:var(--accent)}
.acts .on{color:var(--amber);border-color:var(--amber)}
.acts .spb{color:var(--spotify)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px var(--body);background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:5px 12px}

/* listas de personas y cosas */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .main{min-width:0;flex:1 1 200px;overflow-wrap:anywhere}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 14px var(--display);flex:none}
.pct{font:600 14px var(--mono);color:var(--accent)}
.unread{border-left:3px solid var(--amber);padding-left:10px}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}

/* modal y aviso */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:22px;width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:rgb(10 8 20 / .5)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
iframe.player{width:100%;height:152px;border:0;border-radius:12px}

@media (max-width:480px){.card{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Sintoniza <small id="mhzTop">FM</small></div>
    <div class="row"><span class="who" id="who"></span></div>
  </div>
  <nav class="tabs" id="tabs" hidden>
    <a href="#encuesta" data-v="encuesta">Encuesta</a>
    <a href="#perfil" data-v="perfil">Mi perfil</a>
    <a href="#amigos" data-v="amigos">Amigos</a>
    <a href="#playlists" data-v="playlists">Playlists</a>
    <a href="#buzon" data-v="buzon">Buzón<span class="badge" id="badge" hidden></span></a>
  </nav>
  <div class="dial" aria-hidden="true">
    <div class="ticks" id="ticks"><div class="needle" id="needle"></div></div>
    <div class="freq"><span>FM</span><span>Sintonizando <strong id="mhz">88.0</strong> MHz</span></div>
  </div>
  <main id="app"><section class="card"><p class="muted">Cargando…</p></section></main>
</div>
<dialog id="modal"></dialog>
<div class="toast" id="toast" hidden></div>
<script type="module" src="app.js?v=2"></script>
</body>
</html>
